name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  check:
    name: Check & Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}

      - name: Install Linux dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y libgtk-3-dev libxdo-dev libvulkan-dev

      - name: Cargo check (all crates)
        run: cargo check --workspace

      - name: Tests (logic crates)
        run: |
          cargo test -p contour-app
          cargo test -p pulse-app --no-default-features
          cargo test -p reel-gpui
