[workspace]
resolver = "2"
members = [
    # Shared engine crates
    "shared/prism-canvas",
    "shared/prism-color",
    "shared/prism-core",
    "shared/prism-io",
    "shared/prism-media",
    "shared/prism-ui",
    # App crates
    "apps/pigment",
    "apps/contour",
    "apps/pulse",
    "apps/reel",
    "apps/tone",
]
default-members = [
    "apps/pigment",
    "apps/contour",
    "apps/pulse",
    "apps/reel",
    "apps/tone",
]

[workspace.package]
version = "0.8.0"
edition = "2021"
license = "MIT OR Apache-2.0"
repository = "https://github.com/KwaminaWhyte/prism-suite"

[workspace.dependencies]
# ── Suite crates ──────────────────────────────────────────────────────────────
prism-canvas  = { path = "shared/prism-canvas" }
prism-color   = { path = "shared/prism-color" }
prism-core    = { path = "shared/prism-core" }
prism-io      = { path = "shared/prism-io" }
prism-media   = { path = "shared/prism-media" }
prism-ui      = { path = "shared/prism-ui" }

# ── Shared third-party ────────────────────────────────────────────────────────
glam          = "0.29"
bytemuck      = { version = "1", features = ["derive"] }
serde         = { version = "1", features = ["derive"] }
serde_json    = "1"
thiserror     = "2"
anyhow        = "1"
log           = "0.4"
env_logger    = "0.11"
image         = "0.25"
half          = { version = "2", features = ["bytemuck"] }
pollster      = "0.4"
rfd           = "0.15"
dirs          = "5"
exr           = "1"
gpui          = "0.2.2"
rhai          = "1.25.1"
ttf-parser    = "0.25"
fontdb        = { version = "0.23", default-features = false, features = ["fs"] }
rodio         = { version = "0.22", default-features = false, features = ["playback", "wav"] }
eframe        = "0.34"
egui          = "0.34"
egui-phosphor = "0.12.0"
kurbo         = "0.11"
tiny-skia     = "0.11"
i_overlay     = "7"
vtracer       = "0.6.5"
visioncortex  = "0.8.10"

# ── Lint policy (all crates opt in via `[lints] workspace = true`) ────────────
[workspace.lints.clippy]
needless_range_loop       = "allow"
too_many_arguments        = "allow"
field_reassign_with_default = "allow"

[workspace.lints.rust]
deprecated = "allow"

# ── Build profiles ────────────────────────────────────────────────────────────
[profile.dev]
opt-level = 1          # app stays usable while iterating

[profile.dev.package."*"]
opt-level = 3          # build deps (wgpu, image) always optimized

[profile.release]
lto = "thin"
codegen-units = 1
