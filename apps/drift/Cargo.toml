[package]
name = "drift"
version.workspace = true
edition.workspace = true
license.workspace = true
default-run = "drift"

[[bin]]
name = "drift"
path = "src/main.rs"

[dependencies]
prism-canvas.workspace = true
prism-core.workspace = true
prism-color.workspace = true
prism-io.workspace = true
prism-ui.workspace = true
gpui.workspace = true
glam.workspace = true
serde.workspace = true
serde_json.workspace = true
anyhow.workspace = true
log.workspace = true
env_logger.workspace = true
pollster.workspace = true
rfd.workspace = true
dirs.workspace = true
ureq.workspace = true

# Real ONNX Runtime, behind the optional `onnx` feature. OFF by default so the
# suite builds and CI tests pass without the native ONNX Runtime / model weights.
# `ort` 2.x is published only as prereleases (2.0.0-rc.*), so the requirement is
# pinned explicitly — Cargo will not match a prerelease from a bare "2".
ort = { version = "=2.0.0-rc.10", optional = true }

[features]
# Enable real ONNX inference via the `ort` crate. When off (the default), Drift
# uses the deterministic stub backend in `app_state::onnx_runtime`.
onnx = ["dep:ort"]

[package.metadata.bundle]
name = "Drift"
identifier = "com.prism-suite.drift"
short_description = "AI-first desktop animation app — Adobe Animate + Character Animator analog"
long_description = "Drift is an AI-powered animation studio, part of the open-source Prism creative suite. It targets feature parity with Adobe Animate and Character Animator, with first-class AI motion generation, lip sync, and puppet rigging."
category = "Graphics"
osx_minimum_system_version = "13.0"
osx_url_schemes = ["drift"]

[lints]
workspace = true
