[package]
name = "pulse"
version.workspace = true
edition.workspace = true
license.workspace = true
default-run = "pulse"

[[bin]]
name = "pulse"
path = "src/main.rs"

[dependencies]
prism-core.workspace = true
prism-io.workspace = true
prism-media.workspace = true
prism-ui.workspace = true
gpui.workspace = true
serde.workspace = true
serde_json.workspace = true
log.workspace = true
env_logger.workspace = true
anyhow.workspace = true
rfd.workspace = true
rhai.workspace = true
ttf-parser.workspace = true
fontdb.workspace = true
image = { workspace = true, features = ["png", "gif"] }
rodio = { workspace = true, default-features = false, features = ["playback", "wav"] }

[package.metadata.bundle]
name = "Pulse"
identifier = "com.prism-suite.pulse"
short_description = "Motion graphics and compositing — After Effects analog"
long_description = "Pulse is a GPU-accelerated motion compositor, part of the open-source Prism creative suite."
category = "Graphics"
osx_minimum_system_version = "13.0"
osx_url_schemes = ["pulse"]

[lints]
workspace = true
