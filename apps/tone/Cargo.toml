[package]
name = "tone"
version.workspace = true
edition.workspace = true
license.workspace = true
default-run = "tone"

[[bin]]
name = "tone"
path = "src/main.rs"

[dependencies]
prism-core.workspace = true
prism-color.workspace = true
prism-media.workspace = true
prism-ui.workspace = true
log.workspace = true
env_logger.workspace = true
anyhow.workspace = true
gpui.workspace = true
rfd.workspace = true
dirs.workspace = true
ureq.workspace = true

# Real ONNX Runtime inference, OFF by default. The default build does NOT pull
# `ort` or any native runtime — see `src/app_state/inference.rs`. Enable with
# `cargo build -p tone --features onnx` once model weights are available.
# `ort` 2.x is published on crates.io only as prereleases; pin the rc exactly
# so the optional `onnx` build is reproducible (the API shifts between rcs).
ort = { version = "=2.0.0-rc.10", optional = true }

[features]
default = []
# Enables the real `ort`-backed inference path. Without it, Tone falls back to
# the deterministic stub backend.
onnx = ["dep:ort"]

[package.metadata.bundle]
name = "Tone"
identifier = "com.prism-suite.tone"
short_description = "AI-first music creation — GarageBand/Logic Pro analog"
long_description = "Tone is an AI-first DAW that generates full tracks from prompts while giving you full DAW-level control. Part of the open-source Prism creative suite."
category = "Music"
osx_minimum_system_version = "13.0"
osx_url_schemes = ["tone"]

[lints]
workspace = true
